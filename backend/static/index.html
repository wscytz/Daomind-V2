  <script>
    // 主题初始化 — 在渲染前执行，避免闪烁
    (function(){
      var t = localStorage.getItem('daomind-theme');
      if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>

    /* 字体预加载：Noto Serif SC 从 Google Fonts，国内 fallback 用思源宋体 */

      src: local('Noto Serif SC'), local('Noto Serif CJK SC'),
           local('Source Han Serif SC'), local('Source Han Serif CN'),
           local('SimSun'), local('宋体');
    }
