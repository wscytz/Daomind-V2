name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 2.0.0)'
        required: true
        default: '2.0.0'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          cd ..
          cp -r frontend/dist backend/static/

      - name: Build exe
        working-directory: backend
        run: pyinstaller DaoMind.spec --noconfirm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DaoMind-${{ github.ref_name || inputs.version }}-windows
          path: backend/dist/DaoMind.exe
          retention-days: 30

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          cd ..
          cp -r frontend/dist backend/static/

      - name: Create tarball
        run: |
          cd backend
          pip install -r ../requirements.txt -t vendor/
          tar --exclude='__pycache__' --exclude='*.pyc' -czvf ../DaoMind-${{ github.ref_name || inputs.version }}-linux.tar.gz main.py config.py prompts.py api/ clients/ rag/ services/ static/ data/ launcher.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DaoMind-${{ github.ref_name || inputs.version }}-linux
          path: DaoMind-${{ github.ref_name || inputs.version }}-linux.tar.gz
          retention-days: 30

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: DaoMind-${{ github.ref_name }}-windows
          path: release

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: DaoMind-${{ github.ref_name }}-linux
          path: release

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}